# The Zed extension (tooling/zed-rx): the extension builds for the target Zed loads, and its queries run on the
# grammar extension.toml pins. A query naming a node that grammar does not have stops Zed loading the language.
# On main, the pin must also be the grammar in the tree; a pull request that changes the grammar only gets a
# warning, since the commit to pin is the one its merge makes.
name: zed

on:
  push:
    branches: [main]
    paths: ["tooling/zed-rx/**", "tooling/tree-sitter-rx/**", "examples/*.rx", ".github/workflows/zed.yml"]
  pull_request:
    paths: ["tooling/zed-rx/**", "tooling/tree-sitter-rx/**", "examples/*.rx", ".github/workflows/zed.yml"]
  workflow_dispatch:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/zed-rx
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # check-pin.sh compares trees and names the last commit to touch the grammar
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tooling/zed-rx
      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 -- -D warnings
      - run: cargo build --release --target wasm32-wasip2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1   # as editor.yml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Queries, on the pinned grammar
        run: ./check-queries.sh
      - name: Pin is current
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          status=0
          ./check-pin.sh || status=$?
          [ "$status" -eq 0 ] && exit 0
          if [ "$status" -ne 1 ]; then
            echo "::error::check-pin.sh could not run (exit $status)"
            exit 1
          fi
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            echo "::error::tooling/tree-sitter-rx differs from the rev tooling/zed-rx/extension.toml pins: bump rev"
            exit 1
          fi
          echo "::warning::tooling/tree-sitter-rx differs from the rev tooling/zed-rx/extension.toml pins." \
            "If this changes the grammar, bump rev to the squash commit in a follow-up once it's merged."
